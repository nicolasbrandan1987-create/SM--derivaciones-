<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Gerencial — Swiss Medical VIDA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;padding-bottom:40px}
.hdr{background:#003366;padding:20px;color:white}
.hdr .logo{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.6;margin-bottom:4px}
.hdr h1{font-size:20px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}
@media(min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:white;border-radius:12px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.kpi .val{font-size:28px;font-weight:800;color:#003366}
.kpi .lbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
.tabs{display:flex;gap:0;padding:0 16px;margin-bottom:0}
.tab{padding:10px 18px;font-size:12px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;color:#888}
.tab.active{color:#003366;border-bottom-color:#003366}
.tab-content{display:none}
.tab-content.active{display:block}
.sec{padding:12px 16px}
.section-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#003366;margin-bottom:10px}
table{width:100%;background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07);border-collapse:collapse;font-size:12px}
th{background:#003366;color:white;padding:10px 12px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td{padding:9px 12px;border-bottom:1px solid #f0f0f0}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.bPendiente{background:#fef3c7;color:#92400e}
.bCotizado{background:#dbeafe;color:#1e40af}
.bImposible{background:#f1f5f9;color:#475569}
.bCerradoVenta{background:#d1fae5;color:#065f46}
.bCerradoSinVenta{background:#fee2e2;color:#991b1b}
.filters{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
.fbtn{padding:5px 12px;border-radius:20px;border:1.5px solid #dde3ec;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;background:white;color:#555}
.fbtn.active{background:#003366;border-color:#003366;color:white}
.ranking-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px}
@media(max-width:600px){.ranking-grid{grid-template-columns:1fr}}
.rank-card{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);overflow:hidden}
.rank-card-title{background:#003366;color:white;padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.rank-row{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid #f0f0f0;gap:8px}
.rank-row:last-child{border-bottom:none}
.rank-num{font-size:12px;font-weight:800;color:#003366;width:18px;flex-shrink:0}
.rank-name{font-size:12px;font-weight:600;color:#1a1a1a;flex:1}
.rank-bar-wrap{width:60px;background:#f0f4f8;border-radius:20px;height:5px;flex-shrink:0}
.rank-bar{height:5px;border-radius:20px;background:#003366}
.rank-count{font-size:11px;font-weight:700;color:#003366;width:20px;text-align:right;flex-shrink:0}
.asesor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:12px 16px}
.asesor-card{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.07);cursor:pointer;transition:box-shadow .2s}
.asesor-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.asesor-name{font-size:14px;font-weight:700;color:#003366;margin-bottom:8px}
.asesor-stats{display:flex;gap:8px;flex-wrap:wrap}
.asesor-stat{font-size:11px;color:#555}
.asesor-stat span{font-weight:700;color:#003366}
.conv-bar{height:4px;background:#f0f4f8;border-radius:4px;margin-top:8px}
.conv-fill{height:4px;border-radius:4px;background:#10b981}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo">Swiss Medical · VIDA</div>
  <h1>Panel Gerencial — Derivaciones</h1>
</div>
<div class="kpis">
  <div class="kpi"><div class="val" id="kT">-</div><div class="lbl">Total</div></div>
  <div class="kpi"><div class="val" id="kP">-</div><div class="lbl">Pendientes</div></div>
  <div class="kpi"><div class="val" id="kV">-</div><div class="lbl">Ventas</div></div>
  <div class="kpi"><div class="val" id="kC">-</div><div class="lbl">Conversión</div></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('derivaciones',this)">📋 Derivaciones</div>
  <div class="tab" onclick="showTab('rankings',this)">🏆 Rankings</div>
  <div class="tab" onclick="showTab('asesores',this)">👤 Por Asesor VIDA</div>
</div>

<!-- TAB DERIVACIONES -->
<div class="tab-content active" id="tab-derivaciones">
  <div class="filters">
    <button class="fbtn active" onclick="filtrar('todos',this)">Todos</button>
    <button class="fbtn" onclick="filtrar('Pendiente',this)">⏳ Pendientes</button>
    <button class="fbtn" onclick="filtrar('Cotizado',this)">💬 Cotizados</button>
    <button class="fbtn" onclick="filtrar('CerradoVenta',this)">✅ Con venta</button>
    <button class="fbtn" onclick="filtrar('CerradoSinVenta',this)">❌ Sin venta</button>
  </div>
  <div class="sec">
    <table>
      <thead><tr>
        <th>ID</th><th>Fecha</th><th>Cliente</th><th>Producto</th>
        <th>Asesor Prepaga</th><th>Asesor VIDA</th><th>Estado</th><th>Prima</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- TAB RANKINGS -->
<div class="tab-content" id="tab-rankings">
  <div class="ranking-grid">
    <div class="rank-card">
      <div class="rank-card-title">🏆 Asesores Prepaga que más derivan</div>
      <div id="rank-prepaga"></div>
    </div>
    <div class="rank-card">
      <div class="rank-card-title">⭐ Asesores VIDA con más ventas</div>
      <div id="rank-vida"></div>
    </div>
  </div>
</div>

<!-- TAB POR ASESOR VIDA -->
<div class="tab-content" id="tab-asesores">
  <div class="asesor-grid" id="asesor-grid"></div>
</div>

<script>
var URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbxFYtDeBX4Z_-pLES4SeFT0yRAyKPPUAz3SgJepDiF3J11wSmZYjB9D1Ga5Xn-sGw-P_Q/exec';
var todos = [], filtroActual = 'todos';

var norm = function(e) {
  if (!e) return 'Pendiente';
  var s = e.toLowerCase();
  if (s.indexOf('cotizado') >= 0) return 'Cotizado';
  if (s.indexOf('imposible') >= 0) return 'Imposible';
  if (s.indexOf('cerrado con venta') >= 0) return 'CerradoVenta';
  if (s.indexOf('cerrado sin venta') >= 0) return 'CerradoSinVenta';
  return 'Pendiente';
};

var BL = {Pendiente:'Pendiente',Cotizado:'Cotizado',Imposible:'Imposible contactar',CerradoVenta:'Cerrado c/ venta',CerradoSinVenta:'Cerrado s/ venta'};
var BC = {Pendiente:'bPendiente',Cotizado:'bCotizado',Imposible:'bImposible',CerradoVenta:'bCerradoVenta',CerradoSinVenta:'bCerradoSinVenta'};

window.recibirDerivaciones = function(data) {
  todos = (data.derivaciones || []).map(function(d) {
    return {
      id: d['ID']||'', fecha: d['Fecha']||'', nombre: d['Cliente Nombre']||'',
      tel: d['Cliente Teléfono']||'', producto: d['Producto Prepaga']||'',
      prepaga: d['Asesor Prepaga']||'', asesorVida: d['Asesor VIDA']||'',
      estado: norm(d['Estado']), prima: d['Prima Vendida']||d['Prima Cotizada']||''
    };
  });
  kpis(); render(); renderRankings(); renderAsesores();
};

function cargarDatos() {
  var s = document.createElement('script');
  s.src = URL_SCRIPT + '?accion=getDerivaciones&asesorVida=&callback=recibirDerivaciones&t=' + Date.now();
  document.head.appendChild(s);
}

function kpis() {
  var ventas = todos.filter(function(d){return d.estado==='CerradoVenta';}).length;
  document.getElementById('kT').textContent = todos.length;
  document.getElementById('kP').textContent = todos.filter(function(d){return d.estado==='Pendiente';}).length;
  document.getElementById('kV').textContent = ventas;
  document.getElementById('kC').textContent = todos.length ? Math.round(ventas/todos.length*100)+'%' : '0%';
}

function render() {
  var items = filtroActual === 'todos' ? todos : todos.filter(function(d){return d.estado===filtroActual;});
  var tbody = document.getElementById('tbody');
  if (!items.length) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:20px;color:#888">No hay registros</td></tr>'; return; }
  tbody.innerHTML = items.map(function(d) {
    var fechaCorta = d.fecha ? d.fecha.split(',')[0] : '';
    return '<tr><td>' + d.id + '</td><td>' + fechaCorta + '</td><td>' + d.nombre + '</td><td>' + d.producto + '</td>' +
      '<td>' + d.prepaga + '</td><td>' + d.asesorVida + '</td>' +
      '<td><span class="badge ' + BC[d.estado] + '">' + (BL[d.estado]||d.estado) + '</span></td>' +
      '<td>' + (d.prima ? '$'+d.prima : '') + '</td></tr>';
  }).join('');
}

function renderRankBar(conteo, elId) {
  var sorted = Object.keys(conteo).sort(function(a,b){return conteo[b]-conteo[a];}).slice(0,8);
  var max = sorted.length ? conteo[sorted[0]] : 1;
  document.getElementById(elId).innerHTML = sorted.length ? sorted.map(function(n,i){
    var pct = Math.round(conteo[n]/max*100);
    return '<div class="rank-row"><div class="rank-num">'+(i+1)+'</div><div class="rank-name">'+n+'</div>' +
      '<div class="rank-bar-wrap"><div class="rank-bar" style="width:'+pct+'%"></div></div>' +
      '<div class="rank-count">'+conteo[n]+'</div></div>';
  }).join('') : '<div style="padding:12px;color:#888;font-size:12px">Sin datos</div>';
}

function renderRankings() {
  var conteoPrep = {}, conteoVida = {};
  todos.forEach(function(d) {
    if (d.prepaga) conteoPrep[d.prepaga] = (conteoPrep[d.prepaga]||0)+1;
    if (d.asesorVida && d.estado==='CerradoVenta') conteoVida[d.asesorVida] = (conteoVida[d.asesorVida]||0)+1;
  });
  renderRankBar(conteoPrep, 'rank-prepaga');
  renderRankBar(conteoVida, 'rank-vida');
}

function renderAsesores() {
  var asesores = {};
  todos.forEach(function(d) {
    if (!d.asesorVida) return;
    if (!asesores[d.asesorVida]) asesores[d.asesorVida] = {total:0,pendientes:0,ventas:0,prima:0};
    asesores[d.asesorVida].total++;
    if (d.estado==='Pendiente') asesores[d.asesorVida].pendientes++;
    if (d.estado==='CerradoVenta') {
      asesores[d.asesorVida].ventas++;
      asesores[d.asesorVida].prima += parseFloat(d.prima)||0;
    }
  });
  var html = Object.keys(asesores).sort().map(function(n) {
    var a = asesores[n];
    var conv = a.total ? Math.round(a.ventas/a.total*100) : 0;
    return '<div class="asesor-card">' +
      '<div class="asesor-name">'+n+'</div>' +
      '<div class="asesor-stats">' +
        '<div class="asesor-stat">Total: <span>'+a.total+'</span></div>' +
        '<div class="asesor-stat">Pendientes: <span>'+a.pendientes+'</span></div>' +
        '<div class="asesor-stat">Ventas: <span>'+a.ventas+'</span></div>' +
        (a.prima ? '<div class="asesor-stat">Prima: <span>$'+a.prima.toLocaleString('es-AR')+'</span></div>' : '') +
        '<div class="asesor-stat">Conversión: <span>'+conv+'%</span></div>' +
      '</div>' +
      '<div class="conv-bar"><div class="conv-fill" style="width:'+conv+'%"></div></div>' +
      '</div>';
  }).join('');
  document.getElementById('asesor-grid').innerHTML = html || '<div style="padding:20px;color:#888">Sin datos</div>';
}

function filtrar(f, btn) {
  filtroActual = f;
  document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  render();
}

function showTab(name, el) {
  document.querySelectorAll('.tab-content').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById('tab-'+name).classList.add('active');
  el.classList.add('active');
}

cargarDatos();
</script>
</body>
</html>
