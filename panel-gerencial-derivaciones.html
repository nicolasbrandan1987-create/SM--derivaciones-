<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento Derivaciones — Swiss Medical VIDA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }

  .header {
    background: #003366;
    padding: 20px 24px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header .logo { font-size: 11px; letter-spacing: 1.5px; opacity: 0.6; text-transform: uppercase; margin-bottom: 4px; }
  .header h1 { font-size: 20px; font-weight: 700; }

  /* Stats KPI */
  .kpis {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0;
    background: #002244;
  }
  @media(max-width: 600px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
  .kpi {
    padding: 14px 10px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .kpi:last-child { border-right: none; }
  .kpi .val { font-size: 24px; font-weight: 800; color: white; }
  .kpi .lbl { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }
  .kpi .pct { font-size: 12px; color: #7dd3b0; font-weight: 600; margin-top: 1px; }

  /* Barra de filtros */
  .toolbar {
    background: white;
    border-bottom: 1px solid #eee;
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar select, .toolbar input {
    padding: 7px 12px;
    border: 1.5px solid #dde3ec;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    color: #333;
    background: #fafbfd;
    outline: none;
  }
  .toolbar select:focus, .toolbar input:focus { border-color: #003366; }
  .toolbar label { font-size: 12px; font-weight: 600; color: #555; white-space: nowrap; }

  .btn-export {
    margin-left: auto;
    background: #003366;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Tabla */
  .table-wrap { overflow-x: auto; padding: 16px; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.07); font-size: 13px; }
  thead { background: #003366; color: white; }
  th { padding: 12px 14px; text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; white-space: nowrap; }
  td { padding: 11px 14px; border-bottom: 1px solid #f0f0f0; color: #333; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8fafc; }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 12px;
    white-space: nowrap;
  }
  .b-pendiente { background: #fef3c7; color: #92400e; }
  .b-contactado { background: #dbeafe; color: #1e40af; }
  .b-en-proceso { background: #ede9fe; color: #5b21b6; }
  .b-cerrado { background: #d1fae5; color: #065f46; }
  .b-perdido { background: #fee2e2; color: #991b1b; }

  .wa-link { color: #25d366; text-decoration: none; font-weight: 600; }
  .wa-link:hover { text-decoration: underline; }

  /* Ranking */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 0 16px 16px;
  }
  @media(max-width: 700px) { .panels { grid-template-columns: 1fr; } }

  .panel {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    overflow: hidden;
  }
  .panel-header {
    background: #f0f4f8;
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #003366;
    border-bottom: 1px solid #eee;
  }
  .rank-list { padding: 8px 0; }
  .rank-row {
    display: flex;
    align-items: center;
    padding: 9px 16px;
    gap: 10px;
    border-bottom: 1px solid #f5f5f5;
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-num {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #003366;
    color: white;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .rank-num.gold { background: #f59e0b; }
  .rank-name { flex: 1; font-size: 13px; font-weight: 600; color: #222; }
  .rank-sub { font-size: 11px; color: #888; }
  .rank-val { font-size: 14px; font-weight: 700; color: #003366; }
  .bar-wrap { flex: 1; height: 6px; background: #eee; border-radius: 3px; }
  .bar-fill { height: 100%; background: #003366; border-radius: 3px; transition: width 0.5s; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">Swiss Medical · VIDA</div>
    <h1>Seguimiento de Derivaciones Prepaga → VIDA</h1>
  </div>
</div>

<div class="kpis">
  <div class="kpi"><div class="val" id="kTot">0</div><div class="lbl">Total</div></div>
  <div class="kpi"><div class="val" id="kPend">0</div><div class="lbl">Pendientes</div><div class="pct" id="kPendPct">-</div></div>
  <div class="kpi"><div class="val" id="kProc">0</div><div class="lbl">En proceso</div></div>
  <div class="kpi"><div class="val" id="kCerr">0</div><div class="lbl">Cerrados</div><div class="pct" id="kConv">0%</div></div>
  <div class="kpi"><div class="val" id="kPerd">0</div><div class="lbl">Perdidos</div></div>
</div>

<div class="toolbar">
  <label>Estado</label>
  <select id="filtroEstado" onchange="aplicarFiltros()">
    <option value="">Todos</option>
    <option value="pendiente">Pendiente</option>
    <option value="contactado">Contactado</option>
    <option value="en-proceso">En proceso</option>
    <option value="cerrado">Cerrado</option>
    <option value="perdido">Perdido</option>
  </select>
  <label>Asesor prepaga</label>
  <select id="filtroPrepaga" onchange="aplicarFiltros()"><option value="">Todos</option></select>
  <label>Asesor VIDA</label>
  <select id="filtroVida" onchange="aplicarFiltros()"><option value="">Todos</option></select>
  <input type="text" id="filtroTexto" placeholder="🔍 Buscar cliente..." oninput="aplicarFiltros()">
  <button class="btn-export" onclick="exportarCSV()">↓ Exportar CSV</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Cliente</th>
        <th>Teléfono</th>
        <th>Producto</th>
        <th>Observación</th>
        <th>Asesor Prepaga</th>
        <th>Asesor VIDA</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="tablaBody"></tbody>
  </table>
</div>

<div class="panels">
  <div class="panel">
    <div class="panel-header">🏆 Ranking asesores prepaga por derivaciones</div>
    <div class="rank-list" id="rankPrepaga"></div>
  </div>
  <div class="panel">
    <div class="panel-header">🎯 Efectividad asesores VIDA</div>
    <div class="rank-list" id="rankVida"></div>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzsjkLT20lwZ89zdk628ET1_nNV9fYgzTBnglMTSznRFR-ynbJWCIEIqO2Ex5mCuvJb0A/exec';

  // DATOS DEMO
  const TODOS = [
    { fecha: '12/03/2026 09:14', clienteNombre: 'Carlos Ramírez', clienteTel: '1156789012', productos: 'SMG Plus', observacion: 'Consultó espontáneamente por cobertura de vida. Tiene 2 hijos.', asesorPrepaga: 'Lucía Torres', asesorVida: 'Diego Fernández', estado: 'pendiente' },
    { fecha: '11/03/2026 15:32', clienteNombre: 'Verónica Suárez', clienteTel: '1167890123', productos: 'SMG Platinum', observacion: 'Gerente de empresa. Quiere proteger a su familia.', asesorPrepaga: 'Martín Gómez', asesorVida: 'Ana López', estado: 'contactado' },
    { fecha: '10/03/2026 11:05', clienteNombre: 'Roberto Iglesias', clienteTel: '1178901234', productos: 'SMG Gold', observacion: 'Renovó plan premium. Preguntó por seguros adicionales.', asesorPrepaga: 'Lucía Torres', asesorVida: 'Diego Fernández', estado: 'en-proceso' },
    { fecha: '07/03/2026 10:20', clienteNombre: 'Daniela Herrera', clienteTel: '1189012345', productos: 'SMG Silver', observacion: 'Autónoma. Podría interesarle un seguro básico.', asesorPrepaga: 'Lucía Torres', asesorVida: 'Ana López', estado: 'cerrado' },
    { fecha: '06/03/2026 16:45', clienteNombre: 'Facundo Molina', clienteTel: '1190123456', productos: 'SMG Plus', observacion: 'Joven soltero, sin dependientes. Potencial a largo plazo.', asesorPrepaga: 'Martín Gómez', asesorVida: 'Diego Fernández', estado: 'perdido' },
    { fecha: '05/03/2026 09:30', clienteNombre: 'Sofía Ramos', clienteTel: '1101234567', productos: 'SMG Platinum', observacion: 'Empresaria. Muy interesada en ahorro + cobertura.', asesorPrepaga: 'Paula Ríos', asesorVida: 'Ana López', estado: 'cerrado' },
    { fecha: '04/03/2026 14:10', clienteNombre: 'Nicolás Castro', clienteTel: '1112345678', productos: 'SMG Gold', observacion: 'Padre de 3 hijos. Consulta activa sobre seguros.', asesorPrepaga: 'Paula Ríos', asesorVida: 'Diego Fernández', estado: 'en-proceso' },
    { fecha: '03/03/2026 11:55', clienteNombre: 'Laura Benítez', clienteTel: '1123456789', productos: 'SMG Base', observacion: 'Menciona ahorros limitados pero perfil interesante.', asesorPrepaga: 'Martín Gómez', asesorVida: 'Ana López', estado: 'pendiente' },
  ];

  let datosFiltrados = [...TODOS];

  function poblarFiltros() {
    const prepagaSet = [...new Set(TODOS.map(d => d.asesorPrepaga))].sort();
    const vidaSet = [...new Set(TODOS.map(d => d.asesorVida))].sort();
    const fp = document.getElementById('filtroPrepaga');
    const fv = document.getElementById('filtroVida');
    prepagaSet.forEach(n => fp.innerHTML += `<option value="${n}">${n}</option>`);
    vidaSet.forEach(n => fv.innerHTML += `<option value="${n}">${n}</option>`);
  }

  function aplicarFiltros() {
    const est = document.getElementById('filtroEstado').value;
    const pre = document.getElementById('filtroPrepaga').value;
    const vid = document.getElementById('filtroVida').value;
    const txt = document.getElementById('filtroTexto').value.toLowerCase();
    datosFiltrados = TODOS.filter(d =>
      (!est || d.estado === est) &&
      (!pre || d.asesorPrepaga === pre) &&
      (!vid || d.asesorVida === vid) &&
      (!txt || d.clienteNombre.toLowerCase().includes(txt) || d.clienteTel.includes(txt))
    );
    renderTabla();
    renderStats();
  }

  function badgeClass(e) {
    return { pendiente:'b-pendiente', contactado:'b-contactado', 'en-proceso':'b-en-proceso', cerrado:'b-cerrado', perdido:'b-perdido' }[e] || '';
  }
  function badgeLabel(e) {
    return { pendiente:'Pendiente', contactado:'Contactado', 'en-proceso':'En proceso', cerrado:'Cerrado ✓', perdido:'Perdido' }[e] || e;
  }

  function renderTabla() {
    const body = document.getElementById('tablaBody');
    if (!datosFiltrados.length) {
      body.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:32px;color:#aaa;">Sin derivaciones para los filtros seleccionados</td></tr>`;
      return;
    }
    body.innerHTML = datosFiltrados.map(d => `
      <tr>
        <td style="white-space:nowrap">${d.fecha}</td>
        <td><strong>${d.clienteNombre}</strong></td>
        <td><a class="wa-link" href="https://wa.me/549${d.clienteTel}" target="_blank">📱 ${d.clienteTel}</a></td>
        <td>${d.productos}</td>
        <td style="max-width:220px;font-size:12px;color:#555">${d.observacion}</td>
        <td>${d.asesorPrepaga}</td>
        <td>${d.asesorVida}</td>
        <td><span class="badge ${badgeClass(d.estado)}">${badgeLabel(d.estado)}</span></td>
      </tr>
    `).join('');
  }

  function renderStats() {
    const t = TODOS.length;
    const pend = TODOS.filter(d => d.estado === 'pendiente').length;
    const proc = TODOS.filter(d => d.estado === 'en-proceso' || d.estado === 'contactado').length;
    const cerr = TODOS.filter(d => d.estado === 'cerrado').length;
    const perd = TODOS.filter(d => d.estado === 'perdido').length;
    document.getElementById('kTot').textContent = t;
    document.getElementById('kPend').textContent = pend;
    document.getElementById('kPendPct').textContent = t ? Math.round(pend/t*100)+'%' : '-';
    document.getElementById('kProc').textContent = proc;
    document.getElementById('kCerr').textContent = cerr;
    document.getElementById('kConv').textContent = t ? Math.round(cerr/t*100)+'% conv.' : '0%';
    document.getElementById('kPerd').textContent = perd;

    // Ranking prepaga
    const byPre = {};
    TODOS.forEach(d => { byPre[d.asesorPrepaga] = (byPre[d.asesorPrepaga]||0)+1; });
    const rankPre = Object.entries(byPre).sort((a,b) => b[1]-a[1]);
    const maxPre = rankPre[0]?.[1] || 1;
    document.getElementById('rankPrepaga').innerHTML = rankPre.map(([n,v],i) => `
      <div class="rank-row">
        <div class="rank-num ${i===0?'gold':''}">${i+1}</div>
        <div style="flex:1"><div class="rank-name">${n}</div><div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(v/maxPre*100)}%"></div></div></div>
        <div class="rank-val">${v}</div>
      </div>
    `).join('');

    // Efectividad VIDA
    const byVida = {};
    TODOS.forEach(d => {
      if (!byVida[d.asesorVida]) byVida[d.asesorVida] = {total:0, cerrado:0};
      byVida[d.asesorVida].total++;
      if (d.estado === 'cerrado') byVida[d.asesorVida].cerrado++;
    });
    const rankVida = Object.entries(byVida).map(([n,v]) => [n, v.cerrado, v.total, v.total ? Math.round(v.cerrado/v.total*100) : 0]).sort((a,b) => b[3]-a[3]);
    document.getElementById('rankVida').innerHTML = rankVida.map(([n,cerr,tot,pct],i) => `
      <div class="rank-row">
        <div class="rank-num ${i===0?'gold':''}">${i+1}</div>
        <div style="flex:1"><div class="rank-name">${n}</div><div class="rank-sub">${cerr} cerrados de ${tot}</div></div>
        <div class="rank-val">${pct}%</div>
      </div>
    `).join('');
  }

  function exportarCSV() {
    const cols = ['Fecha','Cliente','Teléfono','Producto','Observación','Asesor Prepaga','Asesor VIDA','Estado'];
    const rows = datosFiltrados.map(d => [d.fecha, d.clienteNombre, d.clienteTel, d.productos, `"${d.observacion}"`, d.asesorPrepaga, d.asesorVida, d.estado].join(','));
    const csv = [cols.join(','), ...rows].join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
    a.download = `derivaciones_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }

  poblarFiltros();
  renderTabla();
  renderStats();
</script>
</body>
</html>
