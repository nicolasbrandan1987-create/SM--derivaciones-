<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis Derivaciones — Swiss Medical VIDA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--azul:#003366;--verde:#10b981;--naranja:#f59e0b;--rojo:#ef4444;--gris:#94a3b8;--celeste:#3b82f6;--violeta:#8b5cf6;--bg:#f0f4f8;--text:#1a1a2e;--text2:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;padding-bottom:40px;color:var(--text)}
.hdr{background:linear-gradient(135deg,var(--azul) 0%,#001f4d 100%);padding:20px 16px 16px;color:white}
.logo{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;opacity:.5;margin-bottom:4px}
.hdr h1{font-size:20px;font-weight:700}
.hdr .sub{font-size:12px;opacity:.6;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:#002244}
.stat{padding:12px 6px;text-align:center;border-right:1px solid rgba(255,255,255,.08)}
.stat:last-child{border-right:none}
.stat .val{font-size:22px;font-weight:700;color:white;font-family:'DM Mono',monospace}
.stat .lbl{font-size:8px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.section{padding:12px 14px 0}
.section-title{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--azul);margin-bottom:10px}
.donut-wrap{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);display:flex;align-items:center;gap:16px}
.donut-legend{flex:1}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-label{flex:1;color:var(--text2)}
.legend-val{font-weight:700;font-family:'DM Mono',monospace}
.ranking-wrap{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-top:10px}
.rank-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rank-row:last-child{margin-bottom:0}
.rank-num{font-size:13px;font-weight:800;color:var(--azul);width:16px;font-family:'DM Mono',monospace}
.rank-name{font-size:12px;font-weight:600;flex:1}
.rank-bar-bg{height:5px;background:#f0f4f8;border-radius:10px;flex:1;max-width:80px}
.rank-bar-fg{height:5px;border-radius:10px;background:var(--azul)}
.rank-n{font-size:11px;font-weight:700;color:var(--azul);font-family:'DM Mono',monospace}
.filters{display:flex;gap:6px;padding:14px 14px 0;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{padding:6px 13px;border-radius:20px;border:1.5px solid #dde3ec;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;background:white;color:var(--text2)}
.fbtn.active{background:var(--azul);border-color:var(--azul);color:white}
.list{padding:10px 14px;display:flex;flex-direction:column;gap:10px}
.card{background:white;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden;border-left:4px solid #e2e8f0}
.card.Pendiente{border-left-color:var(--naranja)}
.card.Contactado{border-left-color:var(--violeta)}
.card.Cotizado{border-left-color:var(--celeste)}
.card.Imposible{border-left-color:var(--gris)}
.card.CerradoVenta{border-left-color:var(--verde)}
.card.CerradoSinVenta{border-left-color:var(--rojo)}
.card-head{padding:12px 12px 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.cnombre{font-size:15px;font-weight:700}
.ctel{font-size:12px;color:var(--text2);margin-top:1px}
.badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.bPendiente{background:#fef3c7;color:#92400e}
.bContactado{background:#ede9fe;color:#5b21b6}
.bCotizado{background:#dbeafe;color:#1e40af}
.bImposible{background:#f1f5f9;color:#475569}
.bCerradoVenta{background:#d1fae5;color:#065f46}
.bCerradoSinVenta{background:#fee2e2;color:#991b1b}
.cmeta{padding:0 12px 6px;font-size:11px;color:var(--text2);display:flex;gap:10px;flex-wrap:wrap}
.cfecha{font-size:10px;color:#aaa;padding:0 12px 6px}
.cobs{padding:6px 12px 8px;background:#fafbfd;border-top:1px solid #f0f0f0;font-size:12px;color:#555;font-style:italic}
.vinfo{padding:6px 12px 8px;background:#f0fdf4;border-top:1px solid #bbf7d0;font-size:11px;color:#065f46;display:flex;gap:12px}
.cinfo{padding:6px 12px 8px;background:#eff6ff;border-top:1px solid #bfdbfe;font-size:11px;color:#1e40af;display:flex;gap:12px}
.cnota-wrap{padding:6px 12px 10px;border-top:1px solid #f0f0f0}
.cnota{width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:12px;font-family:inherit;resize:none;outline:none;color:var(--text);background:#fafbfd}
.cnota:focus{border-color:var(--azul);background:white}
.cnota-btn{margin-top:5px;padding:5px 14px;background:var(--azul);color:white;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}
.cactions{display:flex;border-top:1px solid #f0f0f0}
.abtn{flex:1;padding:10px 6px;font-size:11px;font-weight:600;border:none;background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;color:var(--text2);border-right:1px solid #f0f0f0}
.abtn:last-child{border-right:none}
.abtn.wa{color:#25d366}
.empty{text-align:center;padding:48px 24px;color:var(--text2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:white;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;display:none;min-width:200px;text-align:center}
.toast.show{display:block}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:white;border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:24px 18px 32px;max-height:88vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:700;margin-bottom:16px}
.eopt{padding:13px 14px;border-radius:12px;border:1.5px solid #e2e8f0;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px}
.eopt:hover{border-color:var(--azul);background:#eef4ff;color:var(--azul)}
.xform{display:none;margin-top:14px;border-top:1px solid #f0f0f0;padding-top:14px}
.xform.show{display:block}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;color:#333;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none}
.field input:focus,.field select:focus{border-color:var(--azul)}
.btn-ok{width:100%;background:var(--azul);color:white;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}
.btn-cancel{margin-top:10px;width:100%;padding:12px;border:none;background:#f0f4f8;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2)}
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,51,102,.3);z-index:200;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.loading-box{background:white;border-radius:16px;padding:24px 32px;text-align:center;font-size:14px;font-weight:600;color:var(--azul)}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo">Swiss Medical · VIDA</div>
  <h1>Mis Derivaciones</h1>
  <div class="sub" id="subtitulo">Cargando...</div>
</div>
<div class="stats">
  <div class="stat"><div class="val" id="sT">-</div><div class="lbl">Total</div></div>
  <div class="stat"><div class="val" id="sP">-</div><div class="lbl">Pendientes</div></div>
  <div class="stat"><div class="val" id="sC">-</div><div class="lbl">Cotizados</div></div>
  <div class="stat"><div class="val" id="sV">-</div><div class="lbl">Ventas</div></div>
</div>
<div class="section">
  <div class="section-title">Estado de cartera</div>
  <div class="donut-wrap">
    <svg width="90" height="90" viewBox="0 0 90 90" id="donut-svg">
      <circle cx="45" cy="45" r="35" fill="none" stroke="#f0f4f8" stroke-width="14"/>
    </svg>
    <div class="donut-legend" id="donut-legend"></div>
  </div>
</div>
<div class="section" style="margin-top:10px">
  <div class="section-title">Top derivadores</div>
  <div class="ranking-wrap" id="ranking-wrap"></div>
</div>
<div class="filters">
  <button class="fbtn active" onclick="filtrar('todos',this)">Todos</button>
  <button class="fbtn" onclick="filtrar('Pendiente',this)">⏳ Pendiente</button>
  <button class="fbtn" onclick="filtrar('Contactado',this)">📞 Contactado</button>
  <button class="fbtn" onclick="filtrar('Cotizado',this)">💬 Cotizado</button>
  <button class="fbtn" onclick="filtrar('CerradoVenta',this)">✅ Con venta</button>
  <button class="fbtn" onclick="filtrar('CerradoSinVenta',this)">❌ Sin venta</button>
  <button class="fbtn" onclick="filtrar('Imposible',this)">🚫 Imposible</button>
</div>
<div class="list" id="lista"><div class="empty">⏳ Cargando...</div></div>
<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">⏳ Guardando...</div>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Actualizar estado</h3>
    <div class="eopt" onclick="sel('Pendiente')">⏳ Pendiente</div>
    <div class="eopt" onclick="sel('Contactado')">📞 Contactado</div>
    <div class="eopt" onclick="sel('Cotizado')">💬 Cotizado</div>
    <div class="eopt" onclick="sel('Imposible')">🚫 Imposible contactar</div>
    <div class="eopt" onclick="sel('CerradoVenta')">✅ Cerrado con venta</div>
    <div class="eopt" onclick="sel('CerradoSinVenta')">❌ Cerrado sin venta</div>
    <div class="xform" id="fCotiz">
      <div class="field"><label>Producto cotizado</label>
        <select id="pCotiz"><option value="">Seleccioná...</option><option>APP</option><option>Zafiro Amatista</option><option>Life Planning</option><option>Excellent Savings</option></select></div>
      <div class="field"><label>Prima cotizada ($)</label><input type="number" id="priCotiz" placeholder="Ej: 15000"></div>
      <button class="btn-ok" onclick="confirmar()">Confirmar cotización</button>
    </div>
    <div class="xform" id="fVenta">
      <div class="field"><label>Producto vendido</label>
        <select id="pVenta"><option value="">Seleccioná...</option><option>APP</option><option>Zafiro Amatista</option><option>Life Planning</option><option>Excellent Savings</option></select></div>
      <div class="field"><label>Prima vendida ($)</label><input type="number" id="priVenta" placeholder="Ej: 15000"></div>
      <div class="field"><label>Fecha de venta</label><input type="date" id="fecVenta"></div>
      <button class="btn-ok" onclick="confirmar()">Confirmar venta</button>
    </div>
    <button class="btn-cancel" onclick="cerrar()">Cancelar</button>
  </div>
</div>
<script>
var URL_SCRIPT='https://script.google.com/macros/s/AKfycbxFYtDeBX4Z_-pLES4SeFT0yRAyKPPUAz3SgJepDiF3J11wSmZYjB9D1Ga5Xn-sGw-P_Q/exec';
var ASESOR=decodeURIComponent((new URLSearchParams(window.location.search).get('asesor')||'').replace(/\+/g,' '));
var derivaciones=[],filtroActual='todos',cardActiva=null,estadoActual=null;
document.getElementById('subtitulo').textContent=ASESOR?'Asesor: '+ASESOR:'Sin asesor';

var COLORS={Pendiente:'#f59e0b',Contactado:'#8b5cf6',Cotizado:'#3b82f6',Imposible:'#94a3b8',CerradoVenta:'#10b981',CerradoSinVenta:'#ef4444'};
var BL={Pendiente:'Pendiente',Contactado:'Contactado',Cotizado:'Cotizado',Imposible:'Imposible contactar',CerradoVenta:'Cerrado c/ venta',CerradoSinVenta:'Cerrado s/ venta'};
var BC={Pendiente:'bPendiente',Contactado:'bContactado',Cotizado:'bCotizado',Imposible:'bImposible',CerradoVenta:'bCerradoVenta',CerradoSinVenta:'bCerradoSinVenta'};

function norm(e){
  if(!e)return'Pendiente';
  var s=e.toLowerCase();
  if(s==='contactado'||s.indexOf('contactado')>=0)return'Contactado';
  if(s.indexOf('cotizado')>=0)return'Cotizado';
  if(s.indexOf('imposible')>=0)return'Imposible';
  if(s.indexOf('cerrado con venta')>=0)return'CerradoVenta';
  if(s.indexOf('cerrado sin venta')>=0)return'CerradoSinVenta';
  return'Pendiente';
}

function toast(msg,ok){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=ok?'#065f46':'#991b1b';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},3000);
}

function showLoading(show){
  document.getElementById('loadingOverlay').classList[show?'add':'remove']('show');
}

var cbCounter=0;
function jsonpCall(params,onOk,onError){
  var cbName='smcb_'+Date.now()+'_'+(cbCounter++);
  params.callback=cbName;
  var url=URL_SCRIPT+'?'+Object.keys(params).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);
  }).join('&');
  var s=document.createElement('script');
  var timer=setTimeout(function(){
    delete window[cbName];
    if(s.parentNode)s.parentNode.removeChild(s);
    onError('timeout');
  },15000);
  window[cbName]=function(data){
    clearTimeout(timer);
    delete window[cbName];
    if(s.parentNode)s.parentNode.removeChild(s);
    if(data&&data.ok)onOk(data);
    else onError(data);
  };
  s.onerror=function(){
    clearTimeout(timer);
    delete window[cbName];
    onError('script error');
  };
  s.src=url;
  document.head.appendChild(s);
}

// Cargar datos frescos del servidor
function cargarDatos(){
  jsonpCall(
    {accion:'getDerivaciones',asesorVida:ASESOR},
    function(data){
      var raw=data.derivaciones||[];
      derivaciones=raw.map(function(d){
        return{
          id:d['ID']||'',nombre:d['Cliente Nombre']||'',tel:d['Cliente Teléfono']||'',
          producto:d['Producto Prepaga']||'',obs:d['Observación']||'',
          prepaga:d['Asesor Prepaga']||'',fecha:d['Fecha']||'',
          estado:norm(d['Estado']),prodVida:d['Producto VIDA']||'',
          prima:d['Prima Vendida']||'',fechaVenta:d['Fecha Venta']||'',
          prodCotiz:d['Producto Cotizado']||'',primaCotiz:d['Prima Cotizada']||'',
          notas:d['Notas VIDA']||''
        };
      });
      stats();renderDonut();renderRanking();render();
    },
    function(){
      document.getElementById('lista').innerHTML='<div class="empty">❌ Error al cargar. Recargá la página.</div>';
    }
  );
}

function stats(){
  document.getElementById('sT').textContent=derivaciones.length;
  document.getElementById('sP').textContent=derivaciones.filter(function(d){return d.estado==='Pendiente';}).length;
  document.getElementById('sC').textContent=derivaciones.filter(function(d){return d.estado==='Cotizado';}).length;
  document.getElementById('sV').textContent=derivaciones.filter(function(d){return d.estado==='CerradoVenta';}).length;
}

function renderDonut(){
  var conteo={Pendiente:0,Contactado:0,Cotizado:0,CerradoVenta:0,CerradoSinVenta:0,Imposible:0};
  derivaciones.forEach(function(d){if(conteo[d.estado]!==undefined)conteo[d.estado]++;});
  var total=derivaciones.length||1;
  var r=35,cx=45,cy=45,circ=2*Math.PI*r,offset=0;
  var svg=document.getElementById('donut-svg');
  while(svg.children.length>1)svg.removeChild(svg.lastChild);
  var orden=['CerradoVenta','Cotizado','Contactado','Pendiente','CerradoSinVenta','Imposible'];
  var legendHtml='';
  orden.forEach(function(k){
    if(!conteo[k])return;
    var pct=conteo[k]/total,dash=circ*pct,gap=circ-dash;
    var arc=document.createElementNS('http://www.w3.org/2000/svg','circle');
    arc.setAttribute('cx',cx);arc.setAttribute('cy',cy);arc.setAttribute('r',r);
    arc.setAttribute('fill','none');arc.setAttribute('stroke',COLORS[k]);arc.setAttribute('stroke-width','14');
    arc.setAttribute('stroke-dasharray',dash+' '+gap);
    arc.setAttribute('stroke-dashoffset',-offset*circ);
    arc.setAttribute('transform','rotate(-90 45 45)');
    svg.appendChild(arc);
    offset+=pct;
    legendHtml+='<div class="legend-item"><div class="legend-dot" style="background:'+COLORS[k]+'"></div><div class="legend-label">'+BL[k]+'</div><div class="legend-val">'+conteo[k]+'</div></div>';
  });
  document.getElementById('donut-legend').innerHTML=legendHtml||'<div style="color:#aaa;font-size:12px">Sin datos</div>';
}

function renderRanking(){
  var conteo={};
  derivaciones.forEach(function(d){if(d.prepaga)conteo[d.prepaga]=(conteo[d.prepaga]||0)+1;});
  var sorted=Object.keys(conteo).sort(function(a,b){return conteo[b]-conteo[a];}).slice(0,5);
  var max=sorted.length?conteo[sorted[0]]:1;
  document.getElementById('ranking-wrap').innerHTML=sorted.length?sorted.map(function(n,i){
    var pct=Math.round(conteo[n]/max*100);
    return'<div class="rank-row"><div class="rank-num">'+(i+1)+'</div><div class="rank-name">'+n+'</div><div class="rank-bar-bg"><div class="rank-bar-fg" style="width:'+pct+'%"></div></div><div class="rank-n">'+conteo[n]+'</div></div>';
  }).join(''):'<div style="padding:8px;color:#aaa;font-size:12px">Sin datos aún</div>';
}

function render(){
  var items=filtroActual==='todos'?derivaciones:derivaciones.filter(function(d){return d.estado===filtroActual;});
  var lista=document.getElementById('lista');
  if(!items.length){lista.innerHTML='<div class="empty">📭 No hay derivaciones en este estado</div>';return;}
  lista.innerHTML=items.map(function(d){
    var fechaCorta=d.fecha?d.fecha.split(',')[0]:'';
    var nombre_safe=d.nombre.replace(/'/g,'&#39;').replace(/"/g,'&quot;');
    return'<div class="card '+d.estado+'" id="card-'+d.id+'">'+
      '<div class="card-head"><div><div class="cnombre">'+d.nombre+'</div><div class="ctel">📱 '+d.tel+'</div></div>'+
      '<span class="badge '+BC[d.estado]+'">'+(BL[d.estado]||d.estado)+'</span></div>'+
      '<div class="cmeta"><span>📦 '+d.producto+'</span><span>👤 '+d.prepaga+'</span></div>'+
      (fechaCorta?'<div class="cfecha">📅 '+fechaCorta+'</div>':'')+
      (d.obs?'<div class="cobs">"'+d.obs+'"</div>':'')+
      (d.estado==='Cotizado'&&d.prodCotiz?'<div class="cinfo"><span>💬 '+d.prodCotiz+'</span>'+(d.primaCotiz?'<span>💰 $'+d.primaCotiz+'</span>':'')+'</div>':'')+
      (d.estado==='CerradoVenta'&&d.prodVida?'<div class="vinfo"><span>🛡️ '+d.prodVida+'</span>'+(d.prima?'<span>💰 $'+d.prima+'</span>':'')+'</div>':'')+
      '<div class="cnota-wrap">'+
        '<textarea class="cnota" rows="2" placeholder="Agregar comentario..." id="nota-'+d.id+'">'+d.notas+'</textarea>'+
        '<button class="cnota-btn" onclick="guardarNota(\''+d.id+'\')">Guardar nota</button>'+
      '</div>'+
      '<div class="cactions">'+
        '<button class="abtn wa" onclick="wa(\''+d.tel+'\',\''+nombre_safe+'\')">💬 WhatsApp</button>'+
        '<button class="abtn" onclick="window.location.href=\'tel:+549'+d.tel+'\'">📞 Llamar</button>'+
        '<button class="abtn" onclick="abrirModal(\''+d.id+'\')">✏️ Estado</button>'+
      '</div></div>';
  }).join('');
}

function guardarNota(id){
  var nota=document.getElementById('nota-'+id).value;
  var idx=derivaciones.findIndex(function(d){return d.id===id;});
  if(idx===-1)return;
  var btn=document.querySelector('#card-'+id+' .cnota-btn');
  if(btn)btn.textContent='⏳';
  jsonpCall(
    {accion:'actualizarEstado',id:id,estado:derivaciones[idx].estado,notasVida:nota},
    function(){
      derivaciones[idx].notas=nota;
      if(btn)btn.textContent='✓ Guardado';
      setTimeout(function(){if(btn)btn.textContent='Guardar nota';},2000);
      toast('✓ Nota guardada',true);
    },
    function(){
      if(btn)btn.textContent='❌ Error';
      setTimeout(function(){if(btn)btn.textContent='Guardar nota';},2000);
      toast('Error al guardar nota',false);
    }
  );
}

function filtrar(f,btn){
  filtroActual=f;
  document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');render();
}

function wa(tel,nombre){
  window.open('https://wa.me/549'+tel+'?text='+encodeURIComponent('Hola '+nombre+', te contacto de Swiss Medical Seguros de Vida.'),'_blank');
}

function abrirModal(id){
  cardActiva=id;estadoActual=null;
  document.getElementById('fCotiz').classList.remove('show');
  document.getElementById('fVenta').classList.remove('show');
  document.getElementById('fecVenta').value=new Date().toISOString().split('T')[0];
  document.getElementById('overlay').classList.add('open');
}

function cerrar(){document.getElementById('overlay').classList.remove('open');}

function sel(estado){
  estadoActual=estado;
  document.getElementById('fCotiz').classList.remove('show');
  document.getElementById('fVenta').classList.remove('show');
  if(estado==='Cotizado'){document.getElementById('fCotiz').classList.add('show');return;}
  if(estado==='CerradoVenta'){document.getElementById('fVenta').classList.add('show');return;}
  guardar(estado,{});
}

function confirmar(){
  if(estadoActual==='Cotizado'){
    var p=document.getElementById('pCotiz').value;
    if(!p){alert('Seleccioná el producto');return;}
    guardar('Cotizado',{productoCotizado:p,primaCotizada:document.getElementById('priCotiz').value});
  }else{
    var p=document.getElementById('pVenta').value;
    if(!p){alert('Seleccioná el producto');return;}
    guardar('CerradoVenta',{productoVida:p,prima:document.getElementById('priVenta').value,fechaVenta:document.getElementById('fecVenta').value});
  }
}

function guardar(estado,extras){
  cerrar();
  showLoading(true);
  var params={accion:'actualizarEstado',id:cardActiva,estado:estado};
  Object.keys(extras).forEach(function(k){params[k]=extras[k];});
  jsonpCall(
    params,
    function(){
      showLoading(false);
      toast('✓ Estado guardado',true);
      // Recargar datos frescos del servidor
      cargarDatos();
    },
    function(){
      showLoading(false);
      toast('❌ Error al guardar — reintentando...',false);
      // Reintentar una vez
      setTimeout(function(){
        showLoading(true);
        jsonpCall(params,
          function(){
            showLoading(false);
            toast('✓ Guardado en segundo intento',true);
            cargarDatos();
          },
          function(){
            showLoading(false);
            toast('❌ No se pudo guardar. Intentá de nuevo.',false);
          }
        );
      },3000);
    }
  );
}

document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)cerrar();});
cargarDatos();
</script>
</body>
</html>
